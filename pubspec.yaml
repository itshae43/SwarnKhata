name: swarn_khata
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  google_fonts: ^8.1.0
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.9
  google_sign_in: ^6.2.2

  # OTP Input
  pinput: ^5.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  device_info_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "#13331E"
  adaptive_icon_foreground: "assets/images/logo_square_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
